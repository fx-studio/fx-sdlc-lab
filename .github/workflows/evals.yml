# Eval suite for the agent configuration (playbook Stage 4, "continuous evals in CI").
# Runs when a pull request touches CLAUDE.md, .claude/ or evals/, and once a week (not nightly: cost, see README).
# NOT ENABLED on GitHub yet: it needs ANTHROPIC_API_KEY in the repository secrets, and every run costs money.
# Tried locally first with the same command: `bash evals/run.sh --label local`.
name: evals
on:
  pull_request:
    paths: ['CLAUDE.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tasks start from older commits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Merge gate (playbook): a configuration change that lowers the pass rate gets reviewed before it merges.
        # Here: fail the check below the last accepted rate; a person decides whether to merge anyway.
        run: bash evals/run.sh --label ci --parallel 2 --min 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
